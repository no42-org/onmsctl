# Disabled EventSource. `apply` will upload the events (which the server
# always enables), then issue a follow-up PATCH to disable the source.
# A bounded enabled-flap window exists between those two requests; see
# `onmsctl apply --help` for details. Run with `--verbose` to
# see the flap warning on stderr.
apiVersion: eventconf.opennms.org/v1
kind: EventSource
metadata:
  name: example.disabled
spec:
  enabled: false
  events:
    - uei: uei.opennms.org/example/disabled/test
      label: "Test event in a disabled source"
      severity: Warning
