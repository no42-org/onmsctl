[package]
name = "onmsctl-eventconf"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "EventConf capability for onmsctl: source / event lifecycle (16 REST endpoints), declarative `apply -f` at source granularity, and the multipart upload path"
publish = false

[dependencies]
onmsctl-core = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
quick-xml = { workspace = true }
percent-encoding = { workspace = true }
clap = { workspace = true }
schemars = { workspace = true }

[dev-dependencies]
wiremock = "0.6"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = { workspace = true }
