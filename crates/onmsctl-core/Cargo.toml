[package]
name = "onmsctl-core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Shared infrastructure for onmsctl capabilities: HTTP client, auth (Basic / Bearer / keyring), kubectl-style contexts, output rendering (table / JSON / YAML), and the ApplyTarget driver"
publish = false

[dependencies]
# Errors
thiserror = { workspace = true }
anyhow = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
serde_urlencoded = { workspace = true }

# Config & secrets
directories = { workspace = true }

# HTTP & async
reqwest = { workspace = true }
tokio = { workspace = true }
async-trait = { workspace = true }

# CLI flags shared across capability crates (AsyncFlags clap-derive struct
# for the standard --wait / --timeout / --poll-interval set).
clap = { workspace = true }

# Output rendering
comfy-table = { workspace = true }
similar = { workspace = true }

# Glob expansion for the shared `apply -f` dispatcher (apply_input module).
glob = { workspace = true }

# Keyring needs a platform-native backend selected per OS, otherwise the
# crate compiles to a no-op stub whose reads return "No matching entry
# found" for every credential — silently broken. See the keyring crate's
# feature matrix; we pick the synchronous variant on each platform.
#
# Linux uses kernel keyutils only (no D-Bus secret-service). This keeps
# the dependency closure pure-Rust and lets `aarch64-unknown-linux-gnu`
# cross-builds in CI run without multiarch `libdbus-1-dev`. Desktop users
# who want GNOME Keyring / KWallet support can rebuild with
# `--features=keyring/sync-secret-service` (and accept the libdbus-1
# system dependency at build time).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { workspace = true, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { workspace = true, features = ["linux-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { workspace = true, features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
