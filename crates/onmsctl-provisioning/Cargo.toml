[package]
name = "onmsctl-provisioning"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Provisioning capability for onmsctl: requisition + foreign-source composite kind, declarative `apply -f`, XML→YAML migrator, import lifecycle"
publish = false

[dependencies]
onmsctl-core = { workspace = true }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_norway = { workspace = true }
schemars = { workspace = true }
async-trait = { workspace = true }
percent-encoding = { workspace = true }
quick-xml = { workspace = true }
tokio = { workspace = true, features = ["macros"] }
# Further dependencies (quick-xml for the XML migrator, thiserror /
# anyhow for capability-local errors) are added when those features
# land — kept minimal here to surface dep review only when each is
# actually used.

[dev-dependencies]
wiremock = "0.6"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = { workspace = true }
