# Publishes the Docusaurus site to GitHub Pages (onmsctl.no42.org).
# The gate (gates.yml `docs` job) already proves the site builds on every
# PR; this workflow only deploys from main and when a release is published.
name: docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'website/**'
      - 'examples/**'
      - '.github/workflows/docs.yml'
  # release.yml creates every release as a draft. Publishing the draft
  # redeploys the site so the landing-page badge moves to the new version.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# A release publish and a docs push can land together. Serialize deployments
# to the single github-pages environment instead of failing one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Forks have no Pages site for this domain. deploy needs build, so it skips too.
    if: github.repository == 'no42-org/onmsctl'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A release event would check out the tag; the site is built from
          # the default branch, the tag only names the version.
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: website/.nvmrc
          # This job publishes its build output to Pages; a restored cache
          # here would put an earlier run's dependencies into that path.
          # (zizmor: cache-poisoning)
          package-manager-cache: false

      # Tags also exist for draft releases, so the badge version comes from
      # the latest published release. `gh release view` without a tag
      # returns the latest non-draft, non-prerelease release.
      - name: Resolve latest published release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "ONMSCTL_DOCS_VERSION=$tag" >> "$GITHUB_ENV"

      - name: Build docs
        run: make docs

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/build

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
