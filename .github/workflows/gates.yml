# The single definition of "is this tree shippable".
#
# Called by verify.yml (PRs, pushes to main, weekly cron), release.yml and
# docker.yml (tag pushes). Defining it once means a release cannot publish
# through a gate that pull requests enforce — the drift that copy-pasting
# these steps per workflow invites.
name: gates

on:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26] # was ubuntu-latest, macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No step here pushes with the token; leaving it on disk only
          # widens the blast radius of a compromised build step.
          persist-credentials: false

      - name: Install pinned Rust toolchain (honors rust-toolchain.toml)
        run: rustup show

      # cache-bin off: cargo-deny is a pinned release binary the Makefile
      # fetches into .bin/, so nothing under ~/.cargo/bin is needed here and
      # a cached copy must not shadow the pin. The key rolled once when
      # cache-bin turned off so an old entry with binaries is not restored.
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          key: verify-nobin
          cache-bin: "false"

      - name: Run verify
        run: make verify

  licenses-drift:
    # Dependabot bumps Cargo.lock but never regenerates
    # THIRD-PARTY-LICENSES.md, so the committed report drifts silently —
    # v0.4.4's was stale until the release checklist caught it by hand.
    # Separate from `verify` so a stale license report is not reported as
    # a Rust failure, and Linux-only: the report is target-independent.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain (honors rust-toolchain.toml)
        run: rustup show

      # rust-cache restores ~/.cargo/bin, so cargo-about (a pinned
      # `cargo install`) is only built from source on a cold cache.
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          key: licenses-check

      - name: Check THIRD-PARTY-LICENSES.md against the dep tree
        run: make licenses-check

  actions-lint:
    # Enforces the workflow hygiene rules — SHA pinning, least-privilege
    # permissions, timeouts, template injection, credential persistence —
    # mechanically, instead of by review. Separate from `verify` so a
    # workflow nit does not surface as a Rust failure.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No rust-cache: actionlint and zizmor are pinned, hash-verified
      # release binaries the Makefile fetches into .bin/, and this job runs
      # no cargo command at all.
      - name: Lint workflows
        run: make lint-actions

  fuzz-check:
    # fmt, clippy and cargo-deny for the cargo-fuzz harnesses under fuzz/ on
    # the pinned stable toolchain. Running them needs nightly and is a local activity
    # (`make fuzz`); this job only keeps them compiling when a parser API
    # they call changes. Linux-only: a type/lint check of the harness code
    # has nothing platform-specific to gain from the macOS runner.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain (honors rust-toolchain.toml)
        run: rustup show

      # cache-bin off for the same reason as `verify`: cargo-deny comes
      # from .bin/, and a cached ~/.cargo/bin copy must not shadow the pin.
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          key: fuzz-check-nobin
          cache-bin: "false"
          workspaces: fuzz

      - name: Lint fuzz harnesses
        run: make fuzz-check
