# Reviews dependency changes on the pull request itself, and fails when a
# PR introduces a dependency with a known advisory or a disallowed licence.
#
# This is not redundant with `cargo deny check` in the gate: cargo-deny
# evaluates the whole tree against deny.toml, while this evaluates the
# *diff* and comments the result inline, so the finding lands where the
# decision is being made.
name: dependency-review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write   # post the review summary as a PR comment
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Match deny.toml: project-scope copyleft is not introduced, while
          # file-scope copyleft (MPL-2.0) is acceptable. Keep this list in
          # sync with deny.toml's `allow` plus the licenses named in its
          # `exceptions` — see CONTRIBUTING.md. This action cannot scope a
          # license to one crate, so a per-crate exception in deny.toml
          # (NCSA for libfuzzer-sys) is a blanket allow here; cargo-deny
          # remains the gate that enforces the scoping.
          allow-licenses: >-
            Apache-2.0, MIT, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0,
            Unicode-3.0, Unicode-DFS-2016, Unlicense, Zlib, NCSA,
            CDLA-Permissive-2.0
          fail-on-severity: low
          comment-summary-in-pr: on-failure
