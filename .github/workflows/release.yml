name: release

on:
  push:
    tags: ['v*.*.*']

# Workflow-level permissions: read-only baseline. Jobs that need more
# (notably `release` for cosign keyless OIDC + asset upload) opt in
# explicitly so the OIDC token surface stays narrow.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Never cancel a release mid-flight: a cancelled run can leave a partially
  # populated release behind. Re-pushing a tag (the recovery pattern) queues
  # the new run behind the in-flight one instead of racing it, and the
  # "Create GitHub Release" step below is idempotent so the queued run
  # re-uploads onto the existing draft rather than failing.
  cancel-in-progress: false

jobs:
  validate-tag:
    name: validate tag
    runs-on: ubuntu-24.04 # was ubuntu-latest
    timeout-minutes: 2
    outputs:
      is-prerelease: ${{ steps.parse.outputs.is-prerelease }}
    steps:
      - id: parse
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # Strict semver: vMAJOR.MINOR.PATCH[-PRERELEASE][+BUILD]
          # Rejects typos like `v.1.2.3`, four-component `v1.2.3.4`,
          # and tags with non-semver suffixes.
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$tag' does not match semver vMAJOR.MINOR.PATCH[-PRERELEASE][+BUILD]"
            exit 1
          fi
          if [[ "$tag" == *-* ]]; then
            echo "is-prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  gate:
    name: gate
    needs: [validate-tag]
    # The same fmt/clippy/build/test/deny gate pull requests must pass.
    # Nothing below publishes without it — see gates.yml.
    uses: ./.github/workflows/gates.yml

  build:
    name: build (${{ matrix.target }})
    needs: [validate-tag, gate]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04 # was ubuntu-latest
            cross_apt: ''
            cross_linker: ''
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04 # was ubuntu-latest
            cross_apt: gcc-aarch64-linux-gnu
            cross_linker: aarch64-linux-gnu-gcc
          - target: x86_64-apple-darwin
            runner: macos-26 # was macos-latest
            cross_apt: ''
            cross_linker: ''
          - target: aarch64-apple-darwin
            runner: macos-26 # was macos-latest
            cross_apt: ''
            cross_linker: ''
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain (honors rust-toolchain.toml)
        run: rustup show

      - name: Add cross-compile target
        run: rustup target add ${{ matrix.target }}

      - name: Install cross-compile linker (Linux aarch64 only)
        if: matrix.cross_apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross_apt }}

      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        env:
          # Empty for native builds; set only when cross_linker is non-empty.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.cross_linker }}
        run: make release-build TARGET=${{ matrix.target }}

      - name: Stage artifact and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          name="onmsctl-${{ github.ref_name }}-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/onmsctl" "dist/${name}"
          chmod 0755 "dist/${name}"
          ( cd dist && shasum -a 256 "${name}" > "${name}.sha256" )

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  sbom:
    name: sbom (cyclonedx)
    needs: [validate-tag, gate]
    runs-on: ubuntu-24.04 # was ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        run: rustup show

      # Default rust-cache key (Cargo.lock hash) so this job's cache
      # actually refreshes between runs. The previous static `key: sbom`
      # made the cache restore-only after the first save.
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Generate CycloneDX SBOM
        run: make sbom

      - name: Stage SBOM with release-versioned filename
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # `make sbom` emits one SBOM per workspace member, but only the
          # binary crate's SBOM (`onmsctl.cdx.json`) is meaningful to ship —
          # its transitive dep tree already covers the linked library
          # crates (`onmsctl-core`, `onmsctl-eventconf`), and `onmsctl-it`
          # is a test-only crate whose dev-deps aren't in the binary.
          cp sbom/onmsctl.cdx.json "dist/onmsctl-${{ github.ref_name }}-onmsctl.cdx.json"
          ls -la dist/

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: release
    needs: [validate-tag, gate, build, sbom]
    runs-on: ubuntu-24.04 # was ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release + upload assets
      id-token: write   # cosign keyless OIDC (scoped to this job only)
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Flatten artifact layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts/ -type f \( -name 'onmsctl-*' -o -name '*.sha256' -o -name '*.cdx.json' \) -exec cp {} release/ \;
          ( cd release && ls -la )

      - name: Build SHA256SUMS aggregate (binaries + SBOMs)
        shell: bash
        run: |
          set -euo pipefail
          # Concatenate per-binary `.sha256` entries; then append SBOM
          # checksums so a downstream `sha256sum -c SHA256SUMS` covers
          # every release asset except the signatures themselves.
          : > release/SHA256SUMS
          for f in release/*.sha256; do
            cat "$f" >> release/SHA256SUMS
          done
          ( cd release && shasum -a 256 *.cdx.json >> SHA256SUMS )
          cat release/SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          # Pin to cosign 2.4.x — 2.5+ changed `sign-blob`'s default
          # output to the new bundle format, breaking the split
          # .sig / .pem flow our README + RELEASING.md document
          # (`cosign verify-blob --signature ... --certificate ...`).
          # Bump to a `--bundle`-based flow when we're ready to update
          # the verification recipe in the docs and downstream tooling.
          cosign-release: 'v2.4.3'

      - name: Sign artifacts (sigstore keyless OIDC)
        shell: bash
        env:
          COSIGN_YES: 'true'
        run: |
          set -euo pipefail
          # Sign each artifact exactly once via an explicit allow-list.
          # Avoids the previous double-sign bug where the binary glob
          # `onmsctl-*-*` also matched SBOM filenames `onmsctl-vX-onmsctl.cdx.json`,
          # producing the SBOM's `.sig` once via the binary loop and again
          # via the SBOM glob (the second overwrite silenced the first).
          to_sign=()
          for f in release/onmsctl-*; do
            case "$f" in
              *.sha256|*.sig|*.pem) continue ;;
            esac
            [ -f "$f" ] && to_sign+=("$f")
          done
          to_sign+=("release/SHA256SUMS")
          for f in "${to_sign[@]}"; do
            # cosign 2.4.x (pinned above) writes split .sig / .pem
            # output natively. cosign 2.5+ default-bundled and broke
            # this flow — bumping the pin requires migrating the
            # README / RELEASING.md verification recipe to --bundle.
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done

      - name: Create GitHub Release (draft)
        # Use the native gh CLI rather than softprops/action-gh-release —
        # the action uploads assets in parallel and hits a GitHub
        # asset-metadata-update race condition that drops random
        # individual files. `gh release create` uploads sequentially
        # and waits for each before continuing.
        #
        # The release is created as a DRAFT. Publishing is a deliberate
        # human step (see RELEASING.md) so that (a) there is never a
        # public, asset-less release during the upload window, and
        # (b) the auto-generated notes can be replaced with curated ones
        # before anyone sees them.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          IS_PRERELEASE: ${{ needs.validate-tag.outputs.is-prerelease }}
        run: |
          set -euo pipefail
          PRERELEASE_FLAG=""
          if [ "${IS_PRERELEASE}" = "true" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi
          # Idempotent: a re-pushed tag (the documented recovery flow)
          # queues a second run behind this one, which must re-upload onto
          # the existing draft instead of failing on "already exists".
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists — reusing it."
          else
            gh release create "${TAG}" \
              --repo "${REPO}" \
              --title "${TAG}" \
              --generate-notes \
              --draft \
              $PRERELEASE_FLAG
          fi
          # Upload all artifacts sequentially.
          gh release upload "${TAG}" \
            --repo "${REPO}" \
            --clobber \
            release/*
