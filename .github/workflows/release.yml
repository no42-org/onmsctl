name: release

on:
  push:
    tags: ['v*.*.*']

# Workflow-level permissions: read-only baseline. Jobs that need more
# (notably `release` for cosign keyless OIDC + asset upload) opt in
# explicitly so the OIDC token surface stays narrow.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  # Re-pushing a tag (recovery pattern) cancels the in-flight run rather
  # than queuing a duplicate. Avoids two concurrent jobs racing on the
  # same release and minting redundant Sigstore certs.
  cancel-in-progress: true

jobs:
  validate-tag:
    name: validate tag
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      is-prerelease: ${{ steps.parse.outputs.is-prerelease }}
    steps:
      - id: parse
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          # Strict semver: vMAJOR.MINOR.PATCH[-PRERELEASE][+BUILD]
          # Rejects typos like `v.1.2.3`, four-component `v1.2.3.4`,
          # and tags with non-semver suffixes.
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$tag' does not match semver vMAJOR.MINOR.PATCH[-PRERELEASE][+BUILD]"
            exit 1
          fi
          if [[ "$tag" == *-* ]]; then
            echo "is-prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: build (${{ matrix.target }})
    needs: [validate-tag]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            cross_apt: ''
            cross_linker: ''
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
            cross_apt: gcc-aarch64-linux-gnu
            cross_linker: aarch64-linux-gnu-gcc
          - target: x86_64-apple-darwin
            runner: macos-latest
            cross_apt: ''
            cross_linker: ''
          - target: aarch64-apple-darwin
            runner: macos-latest
            cross_apt: ''
            cross_linker: ''
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Rust toolchain (honors rust-toolchain.toml)
        run: rustup show

      - name: Add cross-compile target
        run: rustup target add ${{ matrix.target }}

      - name: Install cross-compile linker (Linux aarch64 only)
        if: matrix.cross_apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross_apt }}

      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        env:
          # Empty for native builds; set only when cross_linker is non-empty.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.cross_linker }}
        run: make release-build TARGET=${{ matrix.target }}

      - name: Stage artifact and checksum
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          name="onmsctl-${{ github.ref_name }}-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/onmsctl" "dist/${name}"
          chmod 0755 "dist/${name}"
          ( cd dist && shasum -a 256 "${name}" > "${name}.sha256" )

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bin-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 7

  sbom:
    name: sbom (cyclonedx)
    needs: [validate-tag]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pinned Rust toolchain
        run: rustup show

      # Default rust-cache key (Cargo.lock hash) so this job's cache
      # actually refreshes between runs. The previous static `key: sbom`
      # made the cache restore-only after the first save.
      - uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc # v2.9.1

      - name: Generate CycloneDX SBOM
        run: make sbom

      - name: Stage SBOMs with release-versioned filenames
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          # `make sbom` emits one `*.cdx.json` per workspace member with
          # crate-name-prefixed filenames. Tag-prefix each so the release
          # asset names are self-describing without crate-name collision.
          for f in sbom/*.cdx.json; do
            base="$(basename "$f")"
            cp "$f" "dist/onmsctl-${{ github.ref_name }}-${base}"
          done
          ls -la dist/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sbom
          path: dist/
          if-no-files-found: error
          retention-days: 7

  release:
    name: release
    needs: [validate-tag, build, sbom]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the GitHub Release + upload assets
      id-token: write   # cosign keyless OIDC (scoped to this job only)
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts/

      - name: Flatten artifact layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts/ -type f \( -name 'onmsctl-*' -o -name '*.sha256' -o -name '*.cdx.json' \) -exec cp {} release/ \;
          ( cd release && ls -la )

      - name: Build SHA256SUMS aggregate (binaries + SBOMs)
        shell: bash
        run: |
          set -euo pipefail
          # Concatenate per-binary `.sha256` entries; then append SBOM
          # checksums so a downstream `sha256sum -c SHA256SUMS` covers
          # every release asset except the signatures themselves.
          : > release/SHA256SUMS
          for f in release/*.sha256; do
            cat "$f" >> release/SHA256SUMS
          done
          ( cd release && shasum -a 256 *.cdx.json >> SHA256SUMS )
          cat release/SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: Sign artifacts (sigstore keyless OIDC)
        shell: bash
        env:
          COSIGN_YES: 'true'
        run: |
          set -euo pipefail
          # Sign each artifact exactly once via an explicit allow-list.
          # Avoids the previous double-sign bug where the binary glob
          # `onmsctl-*-*` also matched SBOM filenames `onmsctl-vX-onmsctl.cdx.json`,
          # producing the SBOM's `.sig` once via the binary loop and again
          # via the SBOM glob (the second overwrite silenced the first).
          to_sign=()
          for f in release/onmsctl-*; do
            case "$f" in
              *.sha256|*.sig|*.pem) continue ;;
            esac
            [ -f "$f" ] && to_sign+=("$f")
          done
          to_sign+=("release/SHA256SUMS")
          for f in "${to_sign[@]}"; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ needs.validate-tag.outputs.is-prerelease == 'true' }}
          files: |
            release/onmsctl-*
            release/SHA256SUMS
            release/*.sig
            release/*.pem
