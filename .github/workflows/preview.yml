# Preview builds for every push to main. Publishes, clearly marked as
# unstable and never touching `latest` or any `vX.Y.Z` tag:
#
#   - a single mutable `rc` container image, overwritten each build (§5)
#   - a rolling `preview` GitHub prerelease carrying the four signed
#     target binaries, refreshed each build (§3)
#
# Both are gated on the same gates.yml that pull requests must pass, and
# both are signed + provenance-attested exactly like a real release.
#
# This workflow deliberately mirrors docker.yml (image) and release.yml
# (binaries) rather than sharing their jobs: the release path is
# tag-triggered and must stay simple and proven, whereas this is
# branch-triggered with different tag/latest semantics and a cancellable
# concurrency group. Keep the build steps here in sync with those two
# files when either changes.
name: preview

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: preview-${{ github.ref }}
  # A newer main supersedes an in-flight preview — there is no value in
  # finishing a build for a commit that main has already moved past.
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  gate:
    # Fork pushes cannot publish (no GHCR / release rights), so the whole
    # workflow is upstream-only; this guard cascades to every job below.
    if: github.repository == 'no42-org/onmsctl'
    # The same fmt/clippy/build/test/deny + actions-lint gate PRs pass.
    uses: ./.github/workflows/gates.yml

  # ---- rc image -------------------------------------------------------------
  # Mirrors docker.yml, but tags only the mutable `rc` and never `latest`
  # or a semver tag. The single tag overwrites the previous build's, which
  # is the registry-space control (§5).
  image:
    name: rc image (ghcr)
    needs: [gate]
    if: github.repository == 'no42-org/onmsctl'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write      # push the rc image to GHCR
      id-token: write      # cosign keyless OIDC + provenance OIDC
      attestations: write  # SLSA provenance for the image digest
    # arm64 compiles under QEMU emulation, so the build is slow; give it room.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image labels (single `rc` tag)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # One mutable tag. `latest=false` guarantees this preview never
          # moves `latest`, which only a stable release may do (§4).
          tags: |
            type=raw,value=rc
          flavor: |
            latest=false

      - name: Build and push (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.4.3'

      - name: Sign image by digest (sigstore keyless OIDC)
        env:
          COSIGN_YES: 'true'
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Attest build provenance (image digest)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

  # ---- preview binaries -----------------------------------------------------
  # Mirrors release.yml's build matrix, with the version literal `preview`
  # so filenames stay constant across builds (the rolling prerelease then
  # overwrites its assets rather than accumulating per-commit ones).
  build:
    name: build (${{ matrix.target }})
    needs: [gate]
    if: github.repository == 'no42-org/onmsctl'
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            cross_apt: ''
            cross_linker: ''
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04
            cross_apt: gcc-aarch64-linux-gnu
            cross_linker: aarch64-linux-gnu-gcc
          - target: x86_64-apple-darwin
            runner: macos-26
            cross_apt: ''
            cross_linker: ''
          - target: aarch64-apple-darwin
            runner: macos-26
            cross_apt: ''
            cross_linker: ''
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain (honors rust-toolchain.toml)
        run: rustup show

      - name: Add cross-compile target
        run: rustup target add ${{ matrix.target }}

      - name: Install cross-compile linker (Linux aarch64 only)
        if: matrix.cross_apt != ''
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.cross_apt }}

      # Not cached, for the same reason as release.yml: these binaries are
      # signed, attested and published, so a restored cache would feed
      # earlier runs' artifacts into the trusted path. (zizmor: cache-poisoning)
      - name: Build release binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.cross_linker }}
        run: make release-build TARGET=${{ matrix.target }}

      - name: Stage artifact and checksum
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          mkdir -p dist
          name="onmsctl-preview-${TARGET}"
          cp "target/${TARGET}/release/onmsctl" "dist/${name}"
          chmod 0755 "dist/${name}"
          ( cd dist && shasum -a 256 "${name}" > "${name}.sha256" )

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish-preview:
    name: publish preview
    needs: [build]
    if: github.repository == 'no42-org/onmsctl'
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # roll the `preview` prerelease + its tag
      id-token: write      # cosign keyless OIDC + provenance OIDC
      attestations: write  # SLSA provenance for the binaries
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts/

      - name: Flatten artifact layout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts/ -type f \( -name 'onmsctl-*' -o -name '*.sha256' \) -exec cp {} release/ \;
          ( cd release && ls -la )

      - name: Build SHA256SUMS aggregate
        shell: bash
        run: |
          set -euo pipefail
          : > release/SHA256SUMS
          for f in release/*.sha256; do
            cat "$f" >> release/SHA256SUMS
          done
          cat release/SHA256SUMS

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.4.3'

      - name: Sign artifacts (sigstore keyless OIDC)
        shell: bash
        env:
          COSIGN_YES: 'true'
        run: |
          set -euo pipefail
          # Sign each binary once, plus SHA256SUMS. Same allow-list shape as
          # release.yml; no SBOM ships with a preview.
          to_sign=()
          for f in release/onmsctl-*; do
            case "$f" in
              *.sha256|*.sig|*.pem) continue ;;
            esac
            [ -f "$f" ] && to_sign+=("$f")
          done
          to_sign+=("release/SHA256SUMS")
          for f in "${to_sign[@]}"; do
            cosign sign-blob --yes \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem" \
              "$f"
          done

      - name: Attest build provenance (binaries + checksums)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/onmsctl-preview-*
            !release/*.sha256
            !release/*.sig
            !release/*.pem
            release/SHA256SUMS

      - name: Roll the preview prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          # Delete-then-create is the reliable way to move both the release
          # and its `preview` tag to the current commit. A brief 404 on the
          # download URLs mid-roll is acceptable for an explicitly-unstable
          # preview. The `preview` tag is not `v*.*.*`, so this never
          # triggers release.yml or docker.yml.
          gh release delete preview --repo "$REPO" --cleanup-tag --yes || true
          notes="Rolling preview built from \`main\` at commit ${SHA}.

          **Unstable** — rebuilt on every merge to main. Not a release; do
          not depend on it. Use a \`vX.Y.Z\` release for anything real."
          gh release create preview \
            --repo "$REPO" \
            --target "$SHA" \
            --title "Preview (rolling build of main)" \
            --notes "$notes" \
            --prerelease \
            --latest=false
          gh release upload preview --repo "$REPO" --clobber release/*
