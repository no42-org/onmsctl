# Configures the auto-generated release notes that
# .github/workflows/release.yml requests via `gh release create
# --generate-notes`. Those notes seed the draft release; a maintainer
# replaces them with curated ones before publishing (see RELEASING.md).
#
# PRs labeled `internal`, `chore`, or `ignore-for-release` are hidden
# from the public changelog so internal work-in-progress titles do not
# surface in a permanent public record. Categorize the rest by label.
changelog:
  exclude:
    labels:
      - internal
      - chore
      - ignore-for-release
  categories:
    - title: Highlights
      labels:
        - release-note
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Bug Fixes
      labels:
        - bug
        - fix
    - title: Documentation
      labels:
        - documentation
    - title: Other Changes
      labels:
        - "*"
