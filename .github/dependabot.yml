version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    labels:
      - dependencies
    ignore:
      # keyring v4 is a sample app, not the credential-store API — that moved
      # to the keyring-core crate. Stay on v3 until we migrate deliberately.
      - dependency-name: keyring
        update-types:
          - version-update:semver-major
    groups:
      rust-deps:
        # One PR per week with all minor/patch updates across the workspace.
        # Major version bumps still get individual PRs (Dependabot default).
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
    groups:
      gh-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    labels:
      - dependencies
