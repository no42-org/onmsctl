version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    commit-message:
      prefix: build
      include: scope
    labels:
      - dependencies
    groups:
      rust-deps:
        # One PR per week with all minor/patch updates across the workspace.
        # Major version bumps still get individual PRs (Dependabot default).
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
    labels:
      - dependencies
    groups:
      gh-actions:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
