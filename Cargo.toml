[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.4.3"
edition = "2024"
license = "Apache-2.0"
authors = ["Ronny Trommer <ronny@no42.org>"]
repository = "https://github.com/no42-org/onmsctl"
rust-version = "1.95"

[workspace.dependencies]
# CLI & async runtime
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.6"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"

# HTTP & TLS (rustls avoids OpenSSL dependency)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "multipart"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_norway = "0.9"
quick-xml = { version = "0.41", features = ["serialize"] }
schemars = "1"

# Output rendering
comfy-table = "7"
similar = "3"

# Config & secrets
directories = "6"
keyring = "3"

# Errors
thiserror = "2"
anyhow = "1"

# Filesystem
tempfile = "3"
glob = "0.3"

# URL & encoding
percent-encoding = "2"
serde_urlencoded = "0.7"

# Secret zeroing on drop. Keeps cleartext passwords resolved at apply time
# from lingering in freed heap pages. `zeroize_derive` is intentionally
# absent — we only use `Zeroizing<String>` (runtime impl), no field-level
# derive yet. Adding the feature pulls in proc-macro2 / quote / syn for no
# code path that exercises them.
zeroize = "1.8"

# Workspace-internal crates. Explicit version (alongside `path`) keeps
# `cargo-deny check bans` happy — without it the dep registers as a
# wildcard. The version mirrors `workspace.package.version`.
onmsctl-core = { path = "crates/onmsctl-core", version = "=0.4.3" }
onmsctl-businessservice = { path = "crates/onmsctl-businessservice", version = "=0.4.3" }
onmsctl-datacollection = { path = "crates/onmsctl-datacollection", version = "=0.4.3" }
onmsctl-eventconf = { path = "crates/onmsctl-eventconf", version = "=0.4.3" }
onmsctl-iam = { path = "crates/onmsctl-iam", version = "=0.4.3" }
onmsctl-maintenance = { path = "crates/onmsctl-maintenance", version = "=0.4.3" }
onmsctl-provisioning = { path = "crates/onmsctl-provisioning", version = "=0.4.3" }
onmsctl-snmp = { path = "crates/onmsctl-snmp", version = "=0.4.3" }

[profile.release]
strip = "symbols"
lto = "thin"
codegen-units = 1
